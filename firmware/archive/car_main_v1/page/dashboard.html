  <style>
    :root {
      --bg: #07090e;
      --panel: #0d111a;
      --panel-border: rgba(255, 255, 255, 0.08);
      --panel-glow: rgba(0, 242, 254, 0.03);
      --track: #151b26;
      --line: #222b3d;
      --fg: #f0f4f8;
      --dim: #64748b;
      --accent: #f2b01e;
      --cyan: #00f2fe;
      --good: #00e676;
      --warn: #ff9100;
      --bad: #ff1744;
      --on-accent: #07090e;      /* text on cyan buttons */
      --cyan2: #0077ff;          /* gradient end for meter + knob */
      --glow: rgba(0, 242, 254, 0.4);
      --glow-bad: rgba(255, 23, 68, 0.5);
      --well: rgba(0, 0, 0, 0.35);       /* recessed areas */
      --shadow: rgba(0, 0, 0, 0.4);
      --hi: rgba(255, 255, 255, 0.1);    /* card top highlight */
      --h1-from: #ffffff;
      --base-edge: #0a0d14;
      --tick-maj: #8b949e; --tick-min: #3a4350; --tick-lab: #64748b;
      --bat-num: #f0f4f8; --num-shadow: 0 2px 6px rgba(0, 0, 0, 0.8);
      --bg-glow1: rgba(0, 242, 254, 0.05); --bg-glow2: rgba(242, 176, 30, 0.03);
      --font-hud: 'Chakra Petch', sans-serif;
      --font-mono: 'JetBrains Mono', monospace;
    }

    /* ---------- NEUTRAL: soft slate, between light and dark ---------- */
    :root[data-theme="neutral"] {
      --bg: #2b3038; --panel: #353b45; --panel-border: rgba(255, 255, 255, 0.07);
      --track: #2a2f37; --line: #4a525f; --fg: #eef1f5; --dim: #9aa5b4;
      --accent: #f5a524; --cyan: #4cc9f0; --cyan2: #2b8fd6;
      --good: #4ade80; --warn: #fb923c; --bad: #f87171;
      --on-accent: #10161f; --glow: rgba(76, 201, 240, 0.22); --glow-bad: rgba(248, 113, 113, 0.3);
      --well: rgba(0, 0, 0, 0.18); --shadow: rgba(0, 0, 0, 0.22); --hi: rgba(255, 255, 255, 0.06);
      --h1-from: #ffffff; --base-edge: #2f343d;
      --tick-maj: #aab3c0; --tick-min: #59616e; --tick-lab: #9aa5b4;
      --bat-num: #ffffff; --num-shadow: 0 1px 4px rgba(0, 0, 0, 0.45);
      --bg-glow1: rgba(76, 201, 240, 0.04); --bg-glow2: rgba(245, 165, 36, 0.03);
    }
    /* ---------- LIGHT: best for outdoor demos in sunlight ---------- */
    :root[data-theme="light"] {
      --bg: #eef1f5; --panel: #ffffff; --panel-border: rgba(15, 23, 42, 0.09);
      --track: #e6eaf0; --line: #d2d9e2; --fg: #0f172a; --dim: #64748b;
      --accent: #d97706; --cyan: #0891b2; --cyan2: #0e7490;
      --good: #16a34a; --warn: #ea580c; --bad: #dc2626;
      --on-accent: #ffffff; --glow: rgba(8, 145, 178, 0.18); --glow-bad: rgba(220, 38, 38, 0.25);
      --well: rgba(15, 23, 42, 0.04); --shadow: rgba(15, 23, 42, 0.07); --hi: rgba(255, 255, 255, 0);
      --h1-from: #0f172a; --base-edge: #dfe4eb;
      --tick-maj: #94a3b8; --tick-min: #cbd5e1; --tick-lab: #64748b;
      --bat-num: #ffffff; --num-shadow: 0 1px 3px rgba(0, 0, 0, 0.35);
      --bg-glow1: rgba(8, 145, 178, 0.05); --bg-glow2: rgba(217, 119, 6, 0.04);
    }

    [hidden] { display: none !important; }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { height: 100%; margin: 0; }
    body {
      background: var(--bg);
      color: var(--fg);
      font-family: var(--font-hud);
      padding: 12px 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      user-select: none;
      -webkit-user-select: none;
      overscroll-behavior: none;
      background-image: 
        radial-gradient(circle at 50% 0%, var(--bg-glow1), transparent 70%),
        radial-gradient(circle at 80% 100%, var(--bg-glow2), transparent 50%);
    }

    header {
      display: flex;
      align-items: center;
      gap: 12px;
      background: var(--panel);
      border: 1px solid var(--panel-border);
      padding: 10px 16px;
      border-radius: 12px;
      box-shadow: 0 4px 20px var(--shadow);
    }
    h1 {
      font-size: 18px;
      margin: 0;
      font-weight: 700;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      background: linear-gradient(90deg, var(--h1-from), var(--cyan));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    h1::before {
      content: '';
      display: inline-block;
      width: 8px;
      height: 8px;
      background: var(--cyan);
      border-radius: 50%;
      box-shadow: 0 0 10px var(--cyan);
    }

    .pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 3px 10px;
      border-radius: 20px;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.8px;
      text-transform: uppercase;
      font-family: var(--font-mono);
    }
    .pill::before {
      content: '';
      width: 6px;
      height: 6px;
      border-radius: 50%;
    }
    .up { background: color-mix(in srgb, var(--good) 12%, transparent); color: var(--good); border: 1px solid color-mix(in srgb, var(--good) 30%, transparent); }
    .up::before { background: var(--good); box-shadow: 0 0 6px var(--good); }
    .down { background: color-mix(in srgb, var(--bad) 12%, transparent); color: var(--bad); border: 1px solid color-mix(in srgb, var(--bad) 30%, transparent); }
    .down::before { background: var(--bad); box-shadow: 0 0 6px var(--bad); }

    .tabs { margin-left: auto; }
    .tabs {
      display: flex;
      background: var(--well);
      border: 1px solid var(--panel-border);
      border-radius: 8px;
      padding: 3px;
    }
    .tabs button {
      background: none;
      border: 0;
      color: var(--dim);
      padding: 6px 16px;
      border-radius: 6px;
      font-family: var(--font-hud);
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .theme { display: flex; gap: 2px; background: var(--well); border: 1px solid var(--panel-border);
             border-radius: 8px; padding: 3px; }
    .theme button { background: none; border: 0; color: var(--dim); width: 30px; height: 26px; border-radius: 6px;
                    cursor: pointer; display: grid; place-items: center; padding: 0; }
    .theme button svg { width: 15px; height: 15px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; }
    .theme button.on { background: var(--panel); color: var(--fg); box-shadow: 0 1px 3px var(--shadow); }
    .tabs button.on {
      background: var(--cyan);
      color: var(--on-accent);
      font-weight: 700;
      box-shadow: 0 0 12px var(--glow);
    }

    .card {
      background: var(--panel);
      border: 1px solid var(--panel-border);
      border-radius: 14px;
      padding: 16px;
      position: relative;
      overflow: hidden;
      box-shadow: 0 8px 32px var(--shadow);
    }
    .card::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0; height: 1px;
      background: linear-gradient(90deg, transparent, var(--hi), transparent);
    }

    .lab {
      color: var(--dim);
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 1px;
      font-weight: 600;
      margin-bottom: 6px;
    }
    .val {
      font-size: 28px;
      font-weight: 700;
      font-family: var(--font-mono);
      color: var(--fg);
    }
    .unit { font-size: 13px; color: var(--dim); font-weight: 400; margin-left: 4px; }

    /* Drive Grid */
    .drive { flex: 1; display: grid; gap: 12px; grid-template-columns: 180px 1fr 240px; min-height: 0; }
    .side { display: flex; flex-direction: column; gap: 12px; align-items: stretch; min-height: 0; }

    /* Direction Controls */
    .dir { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .dir button {
      background: var(--track);
      color: var(--fg);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 14px 0;
      font-family: var(--font-hud);
      font-size: 14px;
      font-weight: 700;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      cursor: pointer;
      transition: all 0.15s ease;
    }
    .dir button.on {
      background: var(--cyan);
      border-color: var(--cyan);
      color: var(--on-accent);
      box-shadow: 0 0 16px var(--glow);
    }
    .dir .stop {
      background: color-mix(in srgb, var(--bad) 12%, transparent);
      border-color: color-mix(in srgb, var(--bad) 40%, transparent);
      color: var(--bad);
    }
    .dir .stop.on {
      background: var(--bad);
      border-color: var(--bad);
      color: #fff;
      box-shadow: 0 0 20px var(--glow-bad);
    }

    /* Drive Mode Selector */
    .mode { grid-column: 1/-1; display: flex; align-items: center; gap: 12px; }
    .seg {
      flex: 1; display: grid; grid-template-columns: repeat(3, 1fr);
      background: var(--well); border: 1px solid var(--line);
      border-radius: 10px; padding: 4px; gap: 4px;
    }
    .seg button {
      background: none; border: 0; color: var(--dim); border-radius: 7px;
      padding: 8px 0; font-family: var(--font-hud); font-size: 13px;
      font-weight: 700; text-transform: uppercase; cursor: pointer;
      transition: all 0.2s ease;
    }
    .seg button.on {
      background: var(--cyan); color: var(--on-accent);
      box-shadow: 0 0 10px var(--glow);
    }
    .modehint { flex: 1.2; color: var(--dim); font-size: 11px; line-height: 1.35; font-family: var(--font-mono); }

    .locked { opacity: 0.3; pointer-events: none; filter: grayscale(0.8); transition: opacity 0.2s; }
    .nc { opacity: 0.35; filter: grayscale(1); }
    .nc .lab::after { content: ' \00b7 n/c'; color: var(--bad); }
    .nc .val, .nc .num, .nc .gauge { opacity: 0.6; }
    .logbtns { display: flex; gap: 10px; margin-top: 6px; }
    .logbtns a { flex: 1; text-align: center; text-decoration: none; padding: 10px 0; border-radius: 8px; font-weight: 700;
                 font-size: 13px; text-transform: uppercase; background: var(--track); color: var(--fg); border: 1px solid var(--line); }
    .logbtns a.pri { background: var(--cyan); color: var(--on-accent); border-color: var(--cyan); }

    /* Throttle Meter */
    .thr { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 8px; min-height: 0; }
    .thr .pct { font-size: 32px; font-weight: 700; font-family: var(--font-mono); color: var(--cyan); }
    .meter {
      position: relative; flex: 1; width: 68px; background: var(--track);
      border-radius: 12px; overflow: hidden; touch-action: none; cursor: ns-resize;
      border: 1px solid var(--line); box-shadow: inset 0 2px 8px var(--shadow);
    }
    .meter .fill {
      position: absolute; left: 0; right: 0; bottom: 0; height: 0;
      background: linear-gradient(180deg, var(--cyan), var(--cyan2));
      box-shadow: 0 0 15px var(--glow); transition: height 0.08s linear;
    }
    .meter .tick { position: absolute; left: 0; right: 0; height: 1px; background: color-mix(in srgb, var(--fg) 15%, transparent); }
    .thr .hint { color: var(--dim); font-size: 10px; text-align: center; text-transform: uppercase; letter-spacing: 0.5px; }

    /* Mid Panel Layout */
    .mid { display: grid; gap: 12px; grid-template-columns: 1fr 1fr; grid-template-rows: auto minmax(0,1fr) auto auto; min-width: 0; min-height: 0; }
    .mid .dir { grid-column: 1/-1; }

    /* Gauge */
    .gauge { display: block; width: 100%; max-height: 160px; margin-top: 2px; }
    #needle { transition: transform 0.25s cubic-bezier(0.4, 0, 0.2, 1); transform-origin: 100px 100px; }
    #sarc { transition: stroke-dashoffset 0.25s cubic-bezier(0.4, 0, 0.2, 1); }

    /* Battery */
    .batwrap { flex: 1; display: flex; align-items: center; justify-content: center; padding: 6px 0; }
    .bat {
      position: relative; width: min(100%, 200px); aspect-ratio: 2.1;
      border: 2px solid var(--line); border-radius: 12px; padding: 4px;
      background: var(--well);
    }
    .bat::after {
      content: ""; position: absolute; right: -10px; top: 32%; height: 36%; width: 6px;
      background: var(--line); border-radius: 0 3px 3px 0;
    }
    .bat .lvl {
      height: 100%; width: 0; border-radius: 7px; background: var(--good);
      box-shadow: 0 0 10px color-mix(in srgb, var(--good) 30%, transparent); transition: width 0.6s ease, background-color 0.4s;
    }
    .bat .num {
      position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; gap: 4px;
      font-size: 32px; font-weight: 700; font-family: var(--font-mono); color: var(--bat-num); text-shadow: var(--num-shadow);
    }
    .bat .num small { font-size: 14px; font-weight: 500; opacity: 0.75; }
    .bolt { width: 18px; height: 24px; fill: var(--accent); display: none; filter: drop-shadow(0 0 6px var(--accent)); }
    .bat.chg .bolt { display: block; }
    .socsub { color: var(--dim); font-size: 11px; text-align: center; font-family: var(--font-mono); }

    /* Proximity Radar */
    .prox { grid-column: 1/-1; display: flex; flex-direction: column; min-height: 0; }
    .prox svg { flex: 1; width: 100%; min-height: 0; max-height: 240px; margin-top: 4px; }
    .legend { display: flex; gap: 16px; font-size: 11px; color: var(--dim); justify-content: center; font-family: var(--font-mono); }
    .legend i { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; }

    /* Joystick Steering */
    .joy { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; }
    .base {
      position: relative; width: 180px; height: 180px; border-radius: 50%;
      background: radial-gradient(circle, var(--track) 0%, var(--base-edge) 70%);
      border: 1px solid var(--line); touch-action: none; cursor: grab;
      box-shadow: inset 0 4px 12px var(--shadow), 0 0 20px var(--shadow);
    }
    .base::before, .base::after { content: ""; position: absolute; background: var(--line); }
    .base::before { left: 50%; top: 12px; bottom: 12px; width: 1px; }
    .base::after { top: 50%; left: 12px; right: 12px; height: 1px; }
    .knob {
      position: absolute; left: 50%; top: 50%; width: 68px; height: 68px; margin: -34px 0 0 -34px;
      border-radius: 50%; background: linear-gradient(135deg, var(--cyan), var(--cyan2));
      box-shadow: 0 4px 16px var(--glow); z-index: 1; transition: transform 0.15s ease-out;
    }
    .knob.drag { transition: none; }
    .joy .read { font-size: 13px; color: var(--dim); font-family: var(--font-mono); }

    /* Telemetry View */
    .tele { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); }
    .bar { height: 6px; background: var(--track); border-radius: 3px; overflow: hidden; margin-top: 10px; }
    .bar > div { height: 100%; width: 0; border-radius: 3px; background: var(--accent); transition: width 0.25s cubic-bezier(0.4, 0, 0.2, 1); }
    .wide { grid-column: 1/-1; }
    canvas { width: 100%; height: 180px; display: block; }

    /* phone held sideways: tighten so the whole drive screen fits */
    @media (max-height: 560px) and (min-width: 761px) {
      body { padding: 8px 12px; gap: 8px; }
      header { padding: 6px 12px; }
      .drive, .mid { gap: 8px; }
      .card { padding: 10px; }
      .gauge { max-height: 112px; }
      .bat { width: min(100%, 150px); } .bat .num { font-size: 22px; }
      .socsub, .legend, .modehint, .thr .hint { display: none; }
      .prox svg { min-height: 110px; }
      .seg button { padding: 5px 0; font-size: 12px; } .dir button { padding: 9px 0; }
      .thr .pct { font-size: 24px; }
      .base { width: 150px; height: 150px; } .knob { width: 58px; height: 58px; margin: -29px 0 0 -29px; }
    }

    @media (max-width: 760px) {
      header { flex-wrap: wrap; padding: 8px 12px; }
      h1 { font-size: 15px; white-space: nowrap; }
      .tabs button { padding: 6px 12px; }
      body { height: auto; }
      .drive { grid-template-columns: 1fr 1fr; grid-template-areas: "mid mid" "l r"; }
      .mid { grid-area: mid; } .left { grid-area: l; } .right { grid-area: r; }
      .meter { min-height: 180px; }
      .base { width: 140px; height: 140px; }
      .knob { width: 56px; height: 56px; margin: -28px 0 0 -28px; }
      .modehint { display: none; }
    }
  </style>
</head>
<body>

<header>
  <h1>Solar Car UI</h1>
  <span id="st" class="pill down">Connecting</span>
  <nav class="tabs">
    <button data-tab="drive" class="on">Drive</button>
    <button data-tab="tele">Telemetry</button>
  </nav>
</header>

<!-- DRIVE TAB -->
<main id="drive" class="drive">
  <section class="side left card">
    <div class="thr">
      <div class="lab">Throttle</div>
      <div class="pct"><span id="tv">0</span><span class="unit">%</span></div>
      <div class="meter" id="meter">
        <div class="fill" id="tf"></div>
        <div class="tick" style="bottom:25%"></div>
        <div class="tick" style="bottom:50%"></div>
        <div class="tick" style="bottom:75%"></div>
      </div>
      <div class="hint" id="thint">Drag up / down</div>
    </div>
  </section>

  <section class="mid">
    <div class="card" id="cSpd">
      <div class="lab">Speed</div>
      <svg class="gauge" viewBox="0 0 200 150">
        <path d="M30.7 140 A80 80 0 1 1 169.3 140" fill="none" stroke="var(--track)" stroke-width="10" stroke-linecap="round"/>
        <path id="sarc" d="M30.7 140 A80 80 0 1 1 169.3 140" fill="none" stroke="var(--cyan)" stroke-width="10" stroke-linecap="round" pathLength="100" stroke-dasharray="100" stroke-dashoffset="100"/>
        <g id="ticks"></g>
        <line id="needle" x1="100" y1="100" x2="100" y2="34" stroke="var(--accent)" stroke-width="3.5" stroke-linecap="round"/>
        <circle cx="100" cy="100" r="7" fill="var(--panel)" stroke="var(--accent)" stroke-width="3"/>
        <text x="100" y="132" text-anchor="middle" fill="var(--fg)" font-size="24" font-weight="700" font-family="'JetBrains Mono', monospace"><tspan id="spd">0.00</tspan></text>
        <text x="100" y="146" text-anchor="middle" fill="var(--dim)" font-size="10" font-family="'Chakra Petch', sans-serif">m/s</text>
      </svg>
    </div>

    <div class="card" id="cSoc">
      <div class="lab">State of Charge</div>
      <div class="batwrap">
        <div class="bat" id="bat">
          <div class="lvl" id="lvl"></div>
          <div class="num">
            <svg class="bolt" viewBox="0 0 20 26"><path d="M12 0 0 15h8l-2 11L20 10h-8z"/></svg>
            <span id="soc">--</span><small>%</small>
          </div>
        </div>
      </div>
      <div class="socsub" id="socsub">&nbsp;</div>
    </div>

    <div class="card prox">
      <div class="lab">Proximity Sensor Array</div>
      <svg viewBox="0 0 300 260">
        <!-- car, top view (nose up) -->
        <rect x="120" y="85" width="60" height="100" rx="12" fill="var(--track)" stroke="var(--line)"/>
        <path d="M128 98 L150 88 L172 98" fill="none" stroke="var(--dim)" stroke-width="2"/>
        <!-- sensor arcs -->
        <path id="aF" d="M118 70 Q150 50 182 70" fill="none" stroke-width="7" stroke-linecap="round"/>
        <path id="aL" d="M108 108 Q92 82 108 62"  fill="none" stroke-width="7" stroke-linecap="round" transform="rotate(-20 108 85)"/>
        <path id="aR" d="M192 108 Q208 82 192 62" fill="none" stroke-width="7" stroke-linecap="round" transform="rotate(20 192 85)"/>
        <path id="aB" d="M118 200 Q150 220 182 200" fill="none" stroke-width="7" stroke-linecap="round"/>
        <!-- distances -->
        <g font-size="15" font-weight="600" text-anchor="middle" fill="var(--fg)" font-family="'JetBrains Mono', monospace">
          <text x="150" y="38"><tspan id="dF">--</tspan> cm</text>
          <text x="62"  y="70"><tspan id="dL">--</tspan> cm</text>
          <text x="238" y="70"><tspan id="dR">--</tspan> cm</text>
          <text x="150" y="245"><tspan id="dB">--</tspan> cm</text>
        </g>
      </svg>
      <div class="legend"><span><i style="background:var(--good)"></i>&gt; 50 cm</span>
        <span><i style="background:var(--warn)"></i>20–50 cm</span>
        <span><i style="background:var(--bad)"></i>&lt; 20 cm</span></div>
    </div>
    <div class="mode">
      <div class="seg" id="mode">
        <button data-m="0" class="on">Manual</button>
        <button data-m="1">Copilot</button>
        <button data-m="2" class="locked" title="Not available yet">Automatic</button>
      </div>
      <div class="modehint" id="mhint"></div>
    </div>
    <div class="dir">
      <button id="fw">Drive</button>
      <button id="stop" class="stop on">STOP</button>
    </div>
  </section>

  <section class="side right card">
    <div class="lab" style="text-align:center">Steering</div>
    <div class="joy">
      <div class="base" id="base"><div class="knob" id="knob"></div></div>
      <div class="read"><span id="jlab">steer </span><b id="jx">0</b></div>
    </div>
  </section>
</main>

<!-- ============================= TELEMETRY ============================= -->
<main id="tele" class="tele" hidden>
  <div class="card bat-dep"><div class="lab">Pack voltage</div>
    <div class="val"><span id="v">0.00</span><span class="unit">V</span></div>
    <div class="bar"><div id="vb" style="background:var(--good)"></div></div></div>
  <div class="card bat-dep"><div class="lab">Current</div>
    <div class="val"><span id="i">0.00</span><span class="unit">A</span></div>
    <div class="bar"><div id="ib"></div></div></div>
  <div class="card bat-dep"><div class="lab">Load power</div>
    <div class="val"><span id="lw">0.00</span><span class="unit">W</span></div>
    <div class="bar"><div id="lwb" style="background:var(--cyan)"></div></div></div>
  <div class="card" id="cPv"><div class="lab">PV power</div>
    <div class="val"><span id="w">0.00</span><span class="unit">W</span></div>
    <div class="bar"><div id="wb"></div></div></div>
  <div class="card wide" style="min-width:0">
    <div class="lab">Power trace <span style="color:var(--accent)">— PV</span>
      <span style="color:var(--cyan)">— load</span></div>
    <canvas id="cv"></canvas>
  </div>
  <div class="card wide"><div class="lab">Data log (5 Hz, last ~11 min)</div>
    <div class="logbtns"><a class="pri" href="/log.csv" download="solarcar_log.csv">Download CSV</a>
      <a href="#" id="logclr">Clear log</a></div></div>
</main>

<script>
/* ---- PREVIEW ONLY: fake ESP32 so the page runs without hardware. Delete this block on the car. ---- */
class FakeWS{
  constructor(){this.readyState=1;this.th=0;this.dir=0;this.st=0;this.soc=88;this.t0=Date.now();
    setTimeout(()=>this.onopen&&this.onopen(),50); setInterval(()=>this.tick(),100);}
  send(m){const c=m[0],v=m.slice(1);
    if(c==='T')this.th=+v; if(c==='D')this.dir=+v; if(c==='S'){this.th=0;this.dir=0;} if(c==='J')this.st=+v;}
  tick(){const t=(Date.now()-this.t0)/1000,th=this.th/100;
    const mps=(this.dir?th:0)*0.85*(0.94+0.06*Math.sin(t*3.1)),amp=(this.dir?th:0)*1.6+0.05;
    let pv=2.8+2*Math.sin(t*.45)+.25*Math.sin(t*5);if(pv<0)pv=0;
    const v=11.6-1.0*amp-(100-this.soc)*0.02;
    this.soc=Math.min(100,Math.max(0,this.soc+((pv/v)-amp)*0.1*0.35));
    const d=(b,a,p)=>Math.max(4,Math.round(b+a*Math.sin(t*p)));
    this.onmessage&&this.onmessage({data:JSON.stringify({mps,v,i:amp,w:pv,soc:this.soc,
      dF:d(60,50,.6),dL:d(45,35,.9),dR:d(80,40,.4),dB:d(120,100,.3),gear:this.dir,ok:{bat:1,pv:0,enc:1,us:[1,1,1,0]}})});}
}
const USE_FAKE = !location.hostname || location.protocol==='file:';
/* --------------------------------------------------------------------------------------------- */

const $=id=>document.getElementById(id);
let sock, pv=[], ld=[];

function connect(){
  sock = USE_FAKE ? new FakeWS() : new WebSocket('ws://'+location.hostname+':81/');
  sock.onopen  = ()=>{ $('st').textContent='live';    $('st').className='pill up'; };
  sock.onclose = ()=>{ $('st').textContent='offline'; $('st').className='pill down';
                       showGear(0); setTimeout(connect,1200); };
  sock.onmessage = e=>paint(JSON.parse(e.data));
}
const send=m=>{ if(sock&&sock.readyState===1) sock.send(m); };
setInterval(()=>send('K'),200);   // keep-alive: the car stops if it hears nothing for 500 ms

/* ---------------- readouts ---------------- */
/* speedometer scale + ticks: 0–1.0 m/s, minor tick every 0.1, labelled every 0.2 */
const SPEED_MAX=1.0, STEP=0.1, N=Math.round(SPEED_MAX/STEP);
(()=>{ let h='';
  for(let k=0;k<=N;k++){ const a=(-210+240*k/N)*Math.PI/180, maj=k%2===0;
    const r1=maj?60:64, r2=70, c=Math.cos(a), s=Math.sin(a);
    h+=`<line x1="${100+r1*c}" y1="${100+r1*s}" x2="${100+r2*c}" y2="${100+r2*s}" style="stroke:var(${maj?'--tick-maj':'--tick-min'})" stroke-width="${maj?2:1.5}"/>`;
    if(maj) h+=`<text x="${100+49*c}" y="${100+49*s+4}" text-anchor="middle" font-size="11" style="fill:var(--tick-lab)" font-family="'JetBrains Mono', monospace">${+(k*STEP).toFixed(2)}</text>`;
  }
  document.getElementById('ticks').innerHTML=h; })();
const zone=cm=>cm<20?'var(--bad)':cm<50?'var(--warn)':'var(--good)';
const OK={bat:1,pv:1,enc:1,us:[1,1,1,1]};
function paint(d){
  const ok=d.ok||OK, bat=!!ok.bat, pvk=!!ok.pv;
  $('cSoc').classList.toggle('nc',!bat); document.querySelectorAll('.bat-dep').forEach(c=>c.classList.toggle('nc',!bat));
  $('cPv').classList.toggle('nc',!pvk); $('cSpd').classList.toggle('nc',!ok.enc);
  if((d.fs||d.lv) && d.gear===0 && gear!==0) showGear(0);   // car stopped itself (link loss / low voltage)
  $('st').textContent=d.fs?'link lost - stopped':d.lv?'battery low - locked':d.blk?'obstacle - holding':'live';
  $('st').className='pill '+((d.fs||d.lv||d.blk)?'down':'up');
  $('spd').textContent=d.mps.toFixed(2);
  // speedometer
  const f=Math.min(1,d.mps/SPEED_MAX);
  $('sarc').style.strokeDashoffset=(100*(1-f)).toFixed(1);
  $('sarc').style.opacity=f>0.01?1:0;   // hide the round-cap dot at 0
  $('needle').style.transform='rotate('+(-120+240*f)+'deg)';
  // battery
  const soc=Math.max(0,d.soc), chg=d.chg!==undefined?!!d.chg:d.w>d.v*d.i;
  $('soc').textContent=bat?soc.toFixed(0):'--';
  $('lvl').style.width=soc+'%';
  $('lvl').style.backgroundColor=soc<20?'var(--bad)':soc<50?'var(--warn)':'var(--good)';
  $('bat').classList.toggle('chg',chg);
  $('socsub').textContent=!bat?'Battery monitor not connected':chg?'Charging':'Discharging';
  ['F','L','R','B'].forEach((k,n)=>{
    const cm=d['d'+k], on=(ok.us?ok.us[n]:1)&&cm>=0;
    $('d'+k).textContent=!on?'--':cm>=400?'>400':Math.round(cm);
    $('a'+k).setAttribute('stroke',on?zone(cm):'var(--line)');
  });
  const lw=d.v*d.i;
  const f2=(ok,x)=>ok?x.toFixed(2):'--', pc=(ok,x)=>(ok?Math.max(0,Math.min(100,x)):0)+'%';
  $('v').textContent=f2(bat,d.v);  $('vb').style.width=pc(bat,(d.v-9)/3.6*100);
  $('i').textContent=f2(bat,d.i);  $('ib').style.width=pc(bat,Math.abs(d.i)/2*100);
  $('lw').textContent=f2(bat,lw);  $('lwb').style.width=pc(bat,lw/20*100);
  $('w').textContent=f2(pvk,d.w);  $('wb').style.width=pc(pvk,d.w/8*100);
  pv.push(pvk?d.w:NaN); ld.push(bat?lw:NaN); if(pv.length>300){pv.shift();ld.shift();}
  if(!$('tele').hidden) draw();
}
function draw(){
  const c=$('cv'),g=c.getContext('2d'),r=devicePixelRatio||1;
  c.width=c.clientWidth*r; c.height=c.clientHeight*r; g.scale(r,r);
  const W=c.clientWidth,H=c.clientHeight,max=20;
  const css=getComputedStyle(document.documentElement), tok=n=>css.getPropertyValue(n).trim();
  g.clearRect(0,0,W,H); g.strokeStyle=tok('--line'); g.lineWidth=1;
  for(let k=1;k<4;k++){const y=H*k/4;g.beginPath();g.moveTo(0,y);g.lineTo(W,y);g.stroke();}
  const line=(a,col)=>{ if(a.length<2)return; g.strokeStyle=col; g.lineWidth=2; g.beginPath(); let pen=false;
    a.forEach((v,k)=>{ if(isNaN(v)){pen=false;return;} const x=k/299*W,y=H-Math.min(1,v/max)*H*.92-2; pen?g.lineTo(x,y):g.moveTo(x,y); pen=true;}); g.stroke(); };
  line(pv,tok('--accent')); line(ld,tok('--cyan'));
}

/* ---------------- gear: Drive / STOP (latched, one always selected; reverse removed in v1) ---------------- */
let gear=0, mode=0;               // gear: 1 drive, 0 stop   mode: 0 manual, 1 copilot, 2 auto
function showGear(g){
  gear=g; thr=0; $('tv').textContent=0; $('tf').style.height='0%';
  $('fw').classList.toggle('on',g===1); $('stop').classList.toggle('on',g===0);
  applyLocks();
}
function setGear(g){
  if(g===gear) return;
  showGear(g); send(g===0?'S':'D'+g); send('T0');   // every gear change starts from rest
}
$('fw').onclick=()=>setGear(1);
$('stop').onclick=()=>setGear(0);

/* ---------------- drive mode ---------------- */
const HINT=['You drive. The car does exactly what you tell it.',
            'You drive. The car steers away from close walls on either side and stops if something is close in front.',
            'The car drives itself and avoids obstacles. Press STOP at any time.'];
function setMode(m){
  mode=m; document.querySelectorAll('#mode button').forEach(b=>b.classList.toggle('on',+b.dataset.m===m));
  $('mhint').textContent=HINT[m]; send('M'+m); applyLocks();
}
document.querySelectorAll('#mode button').forEach(b=>b.onclick=()=>setMode(+b.dataset.m));
$('logclr').onclick=e=>{ e.preventDefault(); if(!USE_FAKE) fetch('/log/clear'); };

function applyLocks(){
  const auto=mode===2;
  $('meter').classList.toggle('locked',auto||gear===0);
  $('base').classList.toggle('locked',auto);
  $('thint').textContent=auto?'Car is in control':gear===0?'Press Drive':'Drag up / down';
  $('jlab').textContent=auto?'Car is steering':'steer '; $('jx').hidden=auto;
}

/* ---------------- vertical throttle meter ---------------- */
let thr=0;
function setThrottle(p){ thr=Math.round(Math.max(0,Math.min(100,p)));
  $('tv').textContent=thr; $('tf').style.height=thr+'%'; send('T'+thr); }
const meter=$('meter');
const fromY=e=>{ const b=meter.getBoundingClientRect(); return (b.bottom-e.clientY)/b.height*100; };
meter.onpointerdown=e=>{ meter.setPointerCapture(e.pointerId); setThrottle(fromY(e)); };
meter.onpointermove=e=>{ if(meter.hasPointerCapture(e.pointerId)) setThrottle(fromY(e)); };

/* ---------------- joystick (springs back to centre) ---------------- */
const base=$('base'), knob=$('knob'); let jx=0, jy=0, lastJ=0;
function setJoy(x,y,force){
  jx=x; jy=y; knob.style.transform=`translate(${x*base.clientWidth*.32}px,${y*base.clientWidth*.32}px)`;
  const s=Math.round(x*100); $('jx').textContent=s;
  const now=Date.now(); if(force||now-lastJ>50){ lastJ=now; send('J'+s); }   // ~20 Hz max
}
function joyFrom(e){ const b=base.getBoundingClientRect(), R=b.width*.32;
  let x=(e.clientX-b.left-b.width/2)/R, y=(e.clientY-b.top-b.height/2)/R;
  const m=Math.hypot(x,y); if(m>1){x/=m;y/=m;} setJoy(x,y); }
base.onpointerdown=e=>{ base.setPointerCapture(e.pointerId); knob.classList.add('drag'); joyFrom(e); };
base.onpointermove=e=>{ if(base.hasPointerCapture(e.pointerId)) joyFrom(e); };
base.onpointerup=base.onpointercancel=()=>{ knob.classList.remove('drag'); setJoy(0,0,true); };

/* ---------------- tabs ---------------- */
document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{
  document.querySelectorAll('.tabs button').forEach(x=>x.classList.toggle('on',x===b));
  $('drive').hidden=b.dataset.tab!=='drive'; $('tele').hidden=b.dataset.tab!=='tele'; draw();
});
addEventListener('resize',draw);
navigator.wakeLock?.request('screen').catch(()=>{});

connect(); setMode(0);
</script>
